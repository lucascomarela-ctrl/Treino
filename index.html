<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Treino · Lucas</title>
<meta name="theme-color" content="#0E0F0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== sistema visual "Brasa" =====================
   Grafite quente, pensado para OLED e para ler de relance entre séries.
   Laranja = ação · verde = feito/melhora · coral = queda/apagar ·
   dourado = recorde/aviso. Grupamentos mantêm as cores de sempre.     */
:root{
  --bg:#0E0F0D; --card:#171916; --card2:#20231F; --card3:#2A2E28; --line:#2C302A; --line2:#3A3F37;
  --tx:#F3F1EA; --tx2:#D9D7CF; --dim:#B9B7AD; --faint:#8E8D84;
  --amber:#FF8A3D; --acc:#FF8A3D; --acc-tx:#FFAA70; --acc-soft:rgba(255,138,61,.14); --on-acc:#1B1006;
  --green:#5FD08A; --up:#7BE0A2; --green-soft:rgba(95,208,138,.14);
  --red:#FF6B5E; --down:#FF8A80; --red-soft:rgba(255,107,94,.14);
  --gold:#F2C14E; --gold-tx:#F7D27A; --gold-soft:rgba(242,193,78,.13);
  --blue:#6DA3C7; --purple:#A78BFA;
  --fd:"Barlow Semi Condensed",-apple-system,"SF Pro Display",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
/* ARQUITETURA DE VIEWPORT
   A pagina em si nao rola. O #shell tem a altura exata da area visivel
   (visualViewport), que encolhe sozinha quando o teclado sobe, e o unico
   elemento com rolagem e o #app. Assim nenhum campo pode ficar atras do
   teclado, e nao existe mais "corrigir a posicao depois" via JS.        */
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden}
#shell{position:absolute;left:0;right:0;top:0;height:100%;
  display:flex;flex-direction:column;overflow:hidden}
#app{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;scroll-padding-bottom:var(--acess,0px)}

/* ---------- base ---------- */
.num{font-variant-numeric:tabular-nums}
.d{font-family:var(--fd);font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + var(--acess,0px))}
h1{font-family:var(--fd);font-size:34px;line-height:1.05;font-weight:700}
.over{display:block;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sub{color:var(--dim);font-size:13px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.card b{font-size:15px}
.ct{font-family:var(--fd);font-size:20px!important;font-weight:700;line-height:1.15}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tag{color:var(--faint);font-size:12px;text-align:right;white-space:nowrap}
.lbl{display:block;color:var(--dim);font-size:12.5px;margin:14px 0 6px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:10px 12px;
  font-family:inherit;font-size:16px;appearance:none;-webkit-appearance:none}
input::placeholder{color:#6F6E66}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,138,61,.2)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px}
.row>*{flex:1}
button{font-family:inherit;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--tx);
  padding:10px 14px;font-size:15px;font-weight:500;cursor:pointer;min-height:44px}
.btn-p{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
.btn-g{background:transparent;border-color:var(--line);color:var(--tx2)}
.btn-o{background:transparent;border-color:rgba(255,138,61,.5);color:var(--acc-tx);font-weight:700}
.btn-danger{background:transparent;border-color:#4A2A22;color:var(--down)}
.btn-del{background:var(--red);border-color:var(--red);color:#1C0D0D;font-weight:700}
.btn-dash{background:transparent;border:1.5px dashed var(--line2);color:var(--dim)}
.btn-w{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:11px}
.ib{width:40px;height:40px;min-height:40px;padding:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid transparent;color:var(--faint);flex:none}
.ib.bx{border-color:var(--line);background:var(--card)}
.ico{flex:none;display:block}
.chip{min-height:36px;border-radius:999px;padding:7px 14px;font-size:13.5px;color:var(--dim);background:var(--card);border:1px solid var(--line)}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip small{color:inherit;opacity:.7;font-family:var(--fd);font-size:13px;font-weight:600}
.empty{border:1.5px dashed var(--line2);border-radius:20px;padding:26px 18px;text-align:center;color:var(--dim);margin-top:14px;line-height:1.5}
.up{color:var(--up)}.down{color:var(--down)}
/* pílulas de variação */
.dp{display:inline-block;font-family:var(--fd);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;line-height:1.35;padding:1px 8px;border-radius:8px;white-space:nowrap;background:var(--card3);color:var(--dim)}
.dp.up{background:var(--green-soft);color:var(--up)}
.dp.down{background:var(--red-soft);color:var(--down)}
.dp.pr{background:var(--gold-soft);color:var(--gold-tx)}
.dp.neu{background:var(--card3);color:var(--dim)}
/* letra do treino na cor do grupamento principal */
.tl{flex:none;width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:24px;font-weight:700;color:var(--c);background:var(--card2);background:color-mix(in srgb,var(--c) 18%,transparent)}
.tl.s{width:38px;height:38px;border-radius:11px;font-size:20px}
.tl.xs{width:26px;height:26px;border-radius:8px;font-size:15px}
.tl.l{width:56px;height:56px;border-radius:16px;font-size:32px}
.secl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:22px 4px 0}
.flash{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);
  color:var(--tx);border-radius:999px;padding:9px 18px;font-size:14px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.flash.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
th{color:var(--faint);font-weight:600;text-align:left;padding:0 4px 6px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
svg text{font-family:inherit}

/* ---------- barra de abas ---------- */
.nav{flex:0 0 auto;background:rgba(14,15,13,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;padding:6px 4px max(6px,env(safe-area-inset-bottom))}
/* com o teclado aberto a nav some: o espaco vertical vale mais que ela */
body.kb .nav{display:none}
.nav button{flex:1;min-height:0;background:none;border:none;border-radius:0;color:var(--faint);font-size:10.5px;font-weight:500;padding:2px 0 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.nav .ic{width:50px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--acc);font-weight:700}
.nav button.on .ic{background:var(--acc-soft)}

/* ---------- folhas (modais) que sobem de baixo ---------- */
.mask{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);z-index:60;background:rgba(5,6,5,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:28px 28px 0 0;width:100%;max-width:560px;
  padding:10px 20px calc(18px + env(safe-area-inset-bottom));max-height:calc(var(--vvh,100vh) - 44px);overflow:auto;
  box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:sobe .22s ease-out}
.modal::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
@keyframes sobe{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
.modal h2{font-family:var(--fd);font-size:27px;font-weight:700;line-height:1.08}
.modal .ctr{text-align:center}
.macts{display:flex;gap:8px;margin-top:18px}
.macts button{flex:1;min-height:52px}
.macts.col{flex-direction:column}
.mhero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-bottom:4px}
.mhero .ic{width:62px;height:62px;border-radius:99px;display:flex;align-items:center;justify-content:center}
.mhero .ic.ok{background:var(--green-soft);color:var(--green)}
.mhero .ic.pr{border-radius:20px;background:var(--gold);color:#2A1D04}
.mhero .ic.fl{border-radius:20px;background:var(--acc-soft);color:var(--acc)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.mrow:last-of-type{border-bottom:none}
.mrow span:first-child{color:var(--dim)}
.mrow b{white-space:nowrap;text-align:right}
.pr{background:var(--gold-soft);border:1px solid rgba(242,193,78,.3);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:13px;color:#F3E6C2;line-height:1.45}
.prb{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border:1px solid rgba(242,193,78,.35);border-radius:16px;padding:10px 12px;margin-top:14px}
.prb .ic{width:36px;height:36px;flex:none;border-radius:11px;background:var(--gold);color:#2A1D04;display:flex;align-items:center;justify-content:center}
.prb b{font-size:14px;color:var(--gold-tx)}
.prb small{display:block;font-size:12px;color:#D9C690}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.tile{background:var(--card2);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile small{font-size:12px;color:var(--dim)}
.tile .v{font-family:var(--fd);font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;line-height:1.05}
.tile .v i{font-style:normal;font-size:15px;color:var(--dim);margin-left:3px;font-weight:600}
.tile .dp{align-self:flex-start}
.gt{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:16px}
.cmpr{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 78px;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);
  font-family:var(--fd);font-variant-numeric:tabular-nums;font-size:17px}
.cmpr.h{font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding-top:0}
.cmpr:last-child{border-bottom:none}
.cmpr>:last-child{text-align:right;font-size:15px}
.meta{background:var(--card2);border-radius:14px;padding:10px 12px;margin-top:12px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:4px}
/* volume por grupamento (revisão) */
.grow{display:grid;grid-template-columns:86px minmax(0,1fr) 54px 76px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.grow:last-child{border-bottom:none}
.grow .gn{display:flex;align-items:center;gap:7px;color:var(--tx2);white-space:nowrap;overflow:hidden}
.grow .gn i{width:8px;height:8px;border-radius:99px;flex:none}
.gbar-m{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gbar-m>div{height:100%;border-radius:4px}
.grow .gv{font-family:var(--fd);font-size:16px;font-weight:600;text-align:right}
.grow .gdl{font-family:var(--fd);font-size:14px;font-weight:600;text-align:right;white-space:nowrap}

/* ---------- aba Treino ---------- */
/* A barra vive FORA da area de rolagem (#progtop, filho direto do #shell).
   Assim ela nunca sobrepoe conteudo nem depende de margens negativas.     */
#progtop{flex:0 0 auto;background:var(--bg)}
#progtop:empty{display:none}
.progwrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 11px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:9px}
.pt-row{display:flex;align-items:center;gap:12px}
.pt-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.pt-tx b{font-family:var(--fd);font-size:20px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-tx small{font-size:12.5px;color:var(--dim)}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.segs i.ok{background:var(--green)}
.segs i b{display:block;height:100%;background:var(--acc)}
.pt-st{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim)}
.pt-st b{font-family:var(--fd);font-size:16px;color:var(--tx);font-weight:600}
/* com a faixa no topo, a area segura ja foi consumida por ela */
body.prog #app{padding-top:14px}
.feitos{padding:4px 14px}
.frow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:none}
.fck{width:26px;height:26px;flex:none;border-radius:99px;background:var(--green);color:#0B1F12;display:flex;align-items:center;justify-content:center}
.ftx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ftx b{font-size:14.5px;font-weight:600}
.ftx span{font-family:var(--fd);font-variant-numeric:tabular-nums;font-size:15px;color:var(--dim)}
.exc{border-color:rgba(255,138,61,.42);border-radius:22px;display:flex;flex-direction:column;gap:12px}
.exc-top{display:flex;align-items:center;gap:8px;margin:-4px -6px -4px 0}
.gpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--tx2);background:var(--card2);padding:4px 10px;border-radius:999px;white-space:nowrap}
.gpill i{width:8px;height:8px;border-radius:99px;background:var(--c)}
.exn{flex:1;font-size:12px;color:var(--faint)}
.ext{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;background:none;border:none;border-radius:0;padding:0;min-height:0;color:var(--tx);margin-top:-4px}
.ext b{font-family:var(--fd);font-size:27px!important;font-weight:700;line-height:1.05;flex:1}
.ext .ico{color:var(--faint);margin-top:6px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.esq{font-family:var(--fd);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--card2);color:var(--tx2)}
.tec{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--acc-soft);color:var(--acc-tx);display:inline-flex;align-items:center;gap:4px}
.refbox{background:var(--card2);border-radius:14px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:10px}
.refbox .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.refbox small{font-size:12px;color:var(--faint)}
.refbox span{font-family:var(--fd);font-variant-numeric:tabular-nums;font-size:16px;color:var(--tx2)}
.btn-rep{min-height:36px;height:36px;padding:0 10px;border-radius:10px;background:var(--card);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;flex:none}
.sethd,.setrow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.sethd{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:-4px}
.sethd span:first-child{text-align:center}
.sn{width:30px;height:30px;min-height:30px;padding:0;justify-self:center;border-radius:99px;background:var(--card2);border:none;color:var(--dim);
  font-family:var(--fd);font-size:15px;font-weight:600}
.cell{position:relative;display:block;min-width:0}
.cell input{height:48px;border-radius:12px;font-family:var(--fd);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;padding:0 46px 0 12px}
.cell .un{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:500;color:var(--faint);pointer-events:none;white-space:nowrap}
.cell .un.up,.cell .un.down{font-weight:700;font-size:12.5px}
.chk{width:48px;height:48px;min-height:48px;padding:0;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.chk.on{background:var(--green);border-color:var(--green);color:#0B1F12}
.setrow.ok .sn{background:var(--green-soft);color:var(--up)}
.setrow.ok .cell input{background:rgba(95,208,138,.07);border-color:rgba(95,208,138,.32)}
.setrow.warm .sn{background:var(--card3);color:var(--faint);font-size:11px;font-family:inherit;font-weight:700}
.setrow.warm .cell input{color:var(--dim);border-style:dashed}
.exacts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:8px;margin-top:2px}
.exacts button{min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.fila{padding:2px 14px}
.qrow{width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;display:flex;align-items:center;gap:12px;color:var(--tx)}
.qrow:last-child{border-bottom:none}
.qn{width:26px;height:26px;flex:none;border-radius:99px;border:1.5px solid var(--line2);color:var(--dim);font-family:var(--fd);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.qtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qtx b{font-size:14.5px;font-weight:600}
.qtx small{font-size:12.5px;color:var(--dim)}
.qtx small em{font-style:normal;color:var(--acc-tx)}
.sug{display:none;flex-direction:column;gap:4px;margin-top:-4px}
.sugi{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--tx);font-size:14.5px}
.sugi small{color:var(--faint)}

/* ---------- Início ---------- */
.hweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;margin-top:12px}
.hweek span{display:block;font-size:11px;color:var(--faint)}
.hweek span.on{color:var(--acc);font-weight:700}
.hday{width:32px;height:32px;margin:5px auto 0;border-radius:99px;background:var(--card2);display:flex;align-items:center;justify-content:center;
  font-style:normal;font-family:var(--fd);font-size:16px;font-weight:700;color:var(--c)}
.hday.ok{background:var(--card2);background:color-mix(in srgb,var(--c) 20%,transparent)}
.hday.hoje{box-shadow:inset 0 0 0 2px var(--acc);background:rgba(255,138,61,.08)}
.hday.ok.hoje{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.hday.fut{background:transparent;border:1px dashed var(--line)}
.hsug{border-color:rgba(255,138,61,.45);border-radius:22px;display:flex;flex-direction:column;gap:14px}
.hsug .tp{display:flex;gap:14px;align-items:flex-start}
.hsug .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.hsug .tx b{font-family:var(--fd);font-size:23px!important;font-weight:700;line-height:1.1}

<script>
"use strict";
/* ============================ util ============================ */
const $=(s,el=document)=>el.querySelector(s);
const DAY=864e5;
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const isoD=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const ts=iso=>new Date(iso+"T12:00:00").getTime();
const brDate=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(2,4)}`:"—";
const fmt1=n=>n==null?"—":(Math.round(n*10)/10).toString().replace(".",",");
const fmtT=kg=>kg>=1000?fmt1(kg/1000)+" t":Math.round(kg)+" kg";
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const e1rm=(c,r)=>r>0?c*(1+r/30):c;
/* número digitado: aceita vírgula ou ponto como separador decimal.
   O teclado decimal do iPhone em português digita "37,5", e Number()
   sozinho devolve NaN para isso (a série acabava gravada com 0 kg).  */
const num=v=>{if(typeof v==="number")return v;const s=String(v??"").trim().replace(/\s+/g,"").replace(",",".");return s===""?NaN:Number(s)};

/* nome de máquina: suprime especificações (ex.: "Amarelas") */
const normNome=n=>String(n||"")
  .replace(/\s*\bamarel[ao]s?\b/gi,"")
  .replace(/\s*\((?:amarel[ao]s?|pret[ao]s?|nova?s?|velha?s?)?\)/gi,"")
  .replace(/\s{2,}/g," ").trim();

let flashT=null;
function flash(msg){const f=$("#flash");f.textContent=msg;f.classList.add("on");clearTimeout(flashT);flashT=setTimeout(()=>f.classList.remove("on"),2200)}

/* ============================ ícones (SVG de linha) ============================
   Substituem os emojis: mesma aparência em qualquer versão do iOS.      */
const ICO={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
  treino:'<path d="M14.4 14.4 9.6 9.6"/><path d="M18.66 21.51a2 2 0 1 1-2.83-2.83l-1.77 1.77a2 2 0 1 1-2.83-2.83l6.37-6.37a2 2 0 1 1 2.83 2.83l-1.77 1.77a2 2 0 1 1 2.83 2.83z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.4 12.77a2 2 0 1 1-2.83-2.83l1.77-1.77a2 2 0 1 1-2.83-2.83l2.83-2.83a2 2 0 1 1 2.83 2.83l1.77-1.77a2 2 0 1 1 2.83 2.83z"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  evol:'<path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
  med:'<path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/>',
  bkp:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chevR:'<path d="m9 18 6-6-6-6"/>',
  chevD:'<path d="m6 9 6 6 6-6"/>',
  rep:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
  flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  upl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
  spark:'<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2Z"/>',
  pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  alert:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
  arrow:'<path d="M5 12h14"/><path d="m13 5 7 7-7 7"/>'
};
const ic=(n,s=20,sw=2)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[n]||""}</svg>`;
const icMais=`<svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`;
/* pílula de variação: d = diferença, f = formata o valor absoluto (null = só %),
   base = valor anterior (para o %), bom = 1 se subir é bom, -1 se cair é bom,
   0 para neutro (ex.: peso, que depende da fase)                          */
const pctAbs=(d,base)=>{const p=Math.abs(d/base*100);return (p<10?fmt1(p):String(Math.round(p)))+"%"};
function dpill(d,f,base,bom=1){
  if(d==null||!isFinite(d))return "";
  if(Math.abs(d)<0.05)return `<span class="dp neu">= igual</span>`;
  const cls=bom===0?"neu":(d*bom>0?"up":"down");
  const pc=base&&base>0?pctAbs(d,base):"";
  const txt=f?`${f(Math.abs(d))}${pc?` · ${pc}`:""}`:pc;
  return `<span class="dp ${cls}">${d>0?"▲":"▼"} ${txt}</span>`;
}
/* número exibido no campo: vírgula decimal, como o teclado do iPhone digita */
const cIn=v=>v===""||v==null?"":String(v).replace(".",",");
const numT=kg=>fmtT(kg).split(" ")[0], unT=kg=>fmtT(kg).split(" ")[1];
const DIAS_L=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];

/* ============================ trava de zoom ============================
   O iOS ignora user-scalable=no desde o iOS 10, então além do meta tag
   bloqueamos os gestos de pinça (eventos "gesture*", só do Safari) e o
   duplo-toque. touch-action:manipulation no CSS cobre o resto.          */
for(const ev of ["gesturestart","gesturechange","gestureend"])
  document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;
document.addEventListener("touchend",e=>{
  const t=Date.now();
  if(t-lastTouch<=320)e.preventDefault();   // duplo-toque
  lastTouch=t;
},{passive:false});

/* ============================ modal ============================
   confirm()/alert() nativos não funcionam em iframe sandbox — modal próprio. */
let MODAL=null;
function closeModal(){MODAL=null;$("#modal").innerHTML=""}
/* abre como folha que sobe de baixo; opts.col empilha os botões (menus) */
function openModal(html,acoes,opts){
  MODAL={acoes};
  $("#modal").innerHTML=`<div class="mask" onclick="if(event.target===this)modalAcao(-1)">
    <div class="modal" role="dialog" aria-modal="true">${html}
      <div class="macts${opts&&opts.col?" col":""}">
        ${acoes.map((a,i)=>`<button class="${a.cls||"btn-g"}" onclick="modalAcao(${i})">${esc(a.label)}</button>`).join("")}
      </div>
    </div></div>`;
}
window.modalAcao=i=>{
  if(!MODAL)return;
  const a=i<0?MODAL.acoes.find(x=>x.esc):MODAL.acoes[i];
  closeModal();
  if(a&&a.fn)a.fn();
};

/* ==================== registro de uso (só no aparelho) ====================
   Guarda como o app é usado, para orientar melhorias futuras: aberturas,
   abas e tempo em cada uma, toques em botões, eventos principais (concluir,
   salvar, apagar, exportar...), duração dos treinos e erros do app.
   Nada sai do aparelho: os dados vão junto no backup .json e no arquivo
   do "Enviar para o Claude". O resumo e o botão de zerar ficam no Backup. */
const USO_KEY="gym-app-uso-v1", USO_MAX_EV=400, USO_MAX_CHAVES=300, USO_MAX_ERROS=50, USO_MAX_TREINOS=200;
function usoVazio(){return{v:1,desde:new Date().toISOString(),aberturas:0,retornos:0,ultimoBackup:null,eventos:{},toques:{},tempoAbas:{},treinos:[],erros:[],ultimos:[]}}
let USO=usoVazio();
try{const j=JSON.parse(localStorage.getItem(USO_KEY)||"null");if(j&&j.v===1)USO=Object.assign(usoVazio(),j)}catch(e){}
let tUso=null;
function gravarUso(){clearTimeout(tUso);tUso=null;try{localStorage.setItem(USO_KEY,JSON.stringify(USO))}catch(e){}}
function agendarUso(){clearTimeout(tUso);tUso=setTimeout(gravarUso,1500)}
const abaAtual=()=>{try{return TAB}catch(e){return "?"}};
function registrarUso(ev,det){
  try{
    USO.eventos[ev]=(USO.eventos[ev]||0)+1;

/* ==================== carga em barras ====================
   Exercícios marcados com [barras] no nome têm a carga anotada em barras
   do aparelho, não em kg. 1 barra = 5 kg. A conversão vale para tudo que
   é agregado (tonelagem, volume, peso máximo, e1RM); a listagem das
   séries continua mostrando o número que você digitou.               */
const FATOR_BARRA=5;
const fatorEx=n=>/\[barras\]/i.test(String(n||""))?FATOR_BARRA:1;
const kgDe=(nome,carga)=>(num(carga)||0)*fatorEx(nome);
/* ==================== exercícios por tempo ====================
   Prancha e isometrias são anotadas em SEGUNDOS no campo de reps. Para o
   volume a premissa é kg × minutos (60 s = 1 "rep"), então 14 kg × 60 s
   entra como 14 no volume. No e1RM o tempo não conta: vale só a carga.  */
const ehTempo=n=>/prancha|plank|isom[ée]tric|\[seg\]/i.test(String(n||""));
const repsVol=(nome,r)=>(num(r)||0)/(ehTempo(nome)?60:1);
const repsE1=(nome,r)=>ehTempo(nome)?0:(num(r)||0);
const fmtSet=(nome,x)=>`${fmt1(num(x.carga)||0)}×${x.reps}${ehTempo(nome)&&x.reps!==""?"s":""}`;
const tonelagemSessao=s=>(s.exercicios||[]).reduce((a,ex)=>a+(ex.sets||[]).reduce((b,x)=>x.warm?b:b+kgDe(ex.nome,x.carga)*repsVol(ex.nome,x.reps),0),0);

/* ============================ gráficos SVG ============================ */
/* Escala com números redondos: evita eixos tipo 41,8 / 81,6 / 121,4.
   A faixa acompanha os dados (com folga de 8%), mas as linhas de grade
   caem só em valores "bonitos" dentro dela.                            */
function niceStep(x){const e=Math.pow(10,Math.floor(Math.log10(x)));const f=x/e;return (f<1.5?1:f<3?2:f<7?5:10)*e}
function scaleY(min,max,{zero=false,n=4}={}){
  if(!isFinite(min)||!isFinite(max))return{lo:0,hi:1,ticks:[0,1]};
  if(min===max){min-=1;max+=1}
  const folga=(max-min)*0.08;
  let lo=zero?Math.min(0,min):min-folga, hi=max+folga;
  if(hi<=lo)hi=lo+1;
  const step=niceStep((hi-lo)/Math.max(1,n-1));
  const ticks=[];
  for(let v=Math.ceil(lo/step-1e-9)*step;v<=hi+1e-9;v+=step)ticks.push(Math.round(v*1e6)/1e6);
  return{lo,hi,ticks};
}
/* xTime:true -> xs são timestamps e as séries usam [timestamp, y]:
   os intervalos sem treino aparecem como intervalo de verdade no eixo. */
function chart({w=400,h=190,pad={l:38,r:10,t:10,b:20},xs,series=[],bars=null,xLabels=null,yFmt=v=>Math.round(v),xTime=false}){
  const all=[...series.flatMap(s=>s.pts.map(p=>p[1])),...(bars?bars.vals:[])].filter(v=>v!=null&&isFinite(v));
  if(!all.length)return `<div class="sub">Sem dados no período.</div>`;
  const {lo:ymin,hi:ymax,ticks}=scaleY(Math.min(...all),Math.max(...all),{zero:!!bars});
  const xmin=xTime?Math.min(...xs):0, xmax=xTime?Math.max(...xs):Math.max(1,xs.length-1);
  const X=v=>pad.l+(xmax===xmin?0:((v-xmin)/(xmax-xmin))*(w-pad.l-pad.r));
  const Y=v=>pad.t+(1-(v-ymin)/(ymax-ymin))*(h-pad.t-pad.b);
  let out=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">`;
  for(const v of ticks){const y=Y(v);
    out+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
    out+=`<text x="${pad.l-5}" y="${y+4}" text-anchor="end" fill="var(--faint)" font-size="11.5">${esc(yFmt(v))}</text>`;}
  if(bars){const bw=Math.max(2.5,(w-pad.l-pad.r)/Math.max(1,xs.length)*0.6);
    bars.vals.forEach((v,i)=>{if(v==null)return;const y=Y(v),y0=Y(Math.max(0,ymin));
      out+=`<rect x="${X(i)-bw/2}" y="${Math.min(y,y0)}" width="${bw}" height="${Math.abs(y0-y)}" rx="1.5" fill="${bars.colors?bars.colors[i]:bars.color||"var(--amber)"}" opacity=".85"/>`;});}
  for(const s of series){
    const d=s.pts.filter(p=>p[1]!=null&&isFinite(p[1])).map((p,i)=>`${i?"L":"M"}${X(p[0])},${Y(p[1])}`).join("");
    if(d)out+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8"${s.dash?' stroke-dasharray="5 4"':""}/>`;
    if(s.dots)for(const p of s.pts)if(p[1]!=null&&isFinite(p[1]))out+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.2" fill="${s.color}"/>`;
  }
  /* rótulos do eixo X: o primeiro alinha à esquerda e o último à direita,
     senão sobram por fora do viewBox (era o "15/07/2…" cortado).         */
  const lab=(t,x,a)=>`<text x="${x}" y="${h-5}" text-anchor="${a}" fill="var(--faint)" font-size="11.5">${esc(t)}</text>`;
  if(xTime){
    const meses=(xmax-xmin)/DAY>420, n=3;
    const f=t=>{const d=new Date(t),dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0");
      return meses?`${mm}/${String(d.getFullYear()).slice(2)}`:`${dd}/${mm}`};
    for(let i=0;i<=n;i++){const v=xmin+(i/n)*(xmax-xmin);out+=lab(f(v),X(v),i===0?"start":i===n?"end":"middle")}
  }else{
    const lbls=xLabels||xs, step=Math.max(1,Math.ceil(lbls.length/5));
    lbls.forEach((lb,i)=>{if(i%step&&i!==lbls.length-1)return;
      out+=lab(lb,X(i),i===0?"start":i===lbls.length-1?"end":"middle")});
  }
  return out+"</svg>";
}

const flat=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function poolExercicios(treinoNome){
  const ts=(DB.plan&&Array.isArray(DB.plan.treinos))?DB.plan.treinos:[];
  const pool=[];
  const push=n=>{const nn=normNome(n||"");if(nn&&!pool.includes(nn))pool.push(nn)};
  for(const t of ts.filter(t=>t.nome===treinoNome))for(const ex of (t.exercicios||[]))push(ex.nome);
  for(const t of ts.filter(t=>t.nome!==treinoNome))for(const ex of (t.exercicios||[]))push(ex.nome);
  const cnt=new Map();
  for(const s of DB.sessions)for(const ex of (s.exercicios||[])){const n=normNome(ex.nome);if(n)cnt.set(n,(cnt.get(n)||0)+1)}
  for(const n of [...cnt.keys()].sort((a,b)=>cnt.get(b)-cnt.get(a)))push(n);
  return pool;
}
function sugestoesEx(ei){
  const n=UI.novo;const ex=n.exercicios[ei];if(!ex)return[];
  const usados=n.exercicios.filter((_,i)=>i!==ei).map(e=>normNome(e.nome||"")).filter(Boolean);
  const q=flat(ex.nome);
  let pool=poolExercicios(n.treinoNome).filter(x=>!usados.includes(x));
  if(q){
    const comeca=pool.filter(x=>flat(x).startsWith(q));
    const contem=pool.filter(x=>!flat(x).startsWith(q)&&flat(x).includes(q));
    pool=[...comeca,...contem];
    if(pool.length===1&&flat(pool[0])===q)return[];
  }
  const vistos=new Set();
  const dedup=[];
  for(const x of pool){
    const k=familiaDe(x);
    if(vistos.has(k))continue;
    vistos.add(k);
    dedup.push(x);
  }
  return dedup.slice(0,6);
}

function preencherSets(ex,treinoNome){

/* chave da família (identidade) e rótulo (para exibir). Sem regra, a
   chave é o nome limpo e o rótulo é o próprio nome digitado.         */
function familiaInfo(nome){
  const n=String(nome||"");
  let r=FAM_CACHE.get(n);if(r)return r;
  const k=FAM_LIMPA(n);
  r={key:k,label:n,regra:false};
  for(const [f,re] of FAMILIAS)if(re.test(k)){r={key:f,label:f,regra:true};break}
  FAM_CACHE.set(n,r);return r;
}

function exFoco(n){

  if(n.foco!=null&&ex[n.foco]&&!ex[n.foco].done)return n.foco;

/* séries efetivas feitas (marcadas ou de exercício concluído) e a tonelagem delas */
function resumoTreino(n){
  let tot=0,ok=0,ton=0;
  for(const ex of n.exercicios||[])for(const x of ex.sets||[]){
    if(x.warm)continue;tot++;
    if(ex.done||x.ok){ok++;ton+=kgDe(ex.nome,x.carga)*repsVol(ex.nome,x.reps)}
  }
  return{tot,ok,ton};
}

/* última sessão com um exercício da MESMA FAMÍLIA (ver familiaDe). Prefere o
   nome idêntico quando ele existe na mesma data; devolve o nome gravado. */
function ultimaVez(nome){
  const fam=familiaDe(nome);if(!fam)return null;
  for(const s of [...DB.sessions].sort((a,b)=>b.data.localeCompare(a.data))){
    const exs=(s.exercicios||[]).filter(ex=>(ex.sets||[]).length&&familiaDe(ex.nome)===fam);
    if(!exs.length)continue;
    const ex=exs.find(x=>x.nome===nome)||exs[0];
    return{data:s.data,sets:ex.sets,nome:ex.nome};
  }
  return null;
}

/* estatísticas de um exercício (só séries efetivas preenchidas) */
function statsEx(sets,nome){
  const f=fatorEx(nome);
  const ef=(sets||[]).filter(x=>!x.warm&&x.carga!==""&&x.reps!=="");
  const c=x=>(num(x.carga)||0)*f;
  return{
    n:ef.length,
    max:ef.length?Math.max(...ef.map(c)):0,
    vol:ef.reduce((a,x)=>a+c(x)*repsVol(nome,x.reps),0),
    reps:ef.reduce((a,x)=>a+(num(x.reps)||0),0),
    e1:ef.reduce((a,x)=>Math.max(a,c(x)*(1+Math.min(repsE1(nome,x.reps),15)/30)),0),
    txt:ef.map(x=>fmtSet(nome,x)).join("  ")
  };
}
/* variação percentual em relação ao valor anterior (base). Retorna "" quando
   não há base válida. Abaixo de 10% mostra uma casa decimal pra não virar 0%. */
function pctTag(d,base){
  if(d==null||!isFinite(d)||!base||base<=0)return"";
  const p=d/base*100, ap=Math.abs(p);
  const txt=ap<10?fmt1(ap):String(Math.round(ap));
  return ` (${p>0?"+":"−"}${txt}%)`;
}
function deltaTag(d,f,base){
  if(d==null||!isFinite(d))return"";
  if(Math.abs(d)<0.05)return `<span style="color:var(--dim);font-weight:600"> = igual</span>`;
  return `<span class="num" style="color:${d>0?"var(--green)":"var(--red)"};font-weight:600"> ${d>0?"▲ +":"▼ −"}${f(Math.abs(d))}${pctTag(d,base)}</span>`;
}

/* melhor e1RM histórico de um exercício, ignorando as sessões informadas */
function recordeE1rm(nome,excluirId){
  let best=0;
  for(const s of DB.sessions){
    if(s.id===excluirId)continue;
    for(const ex of (s.exercicios||[])){
      if(!mesmaFamilia(ex.nome,nome))continue;
      for(const x of (ex.sets||[]))if(!x.warm)best=Math.max(best,e1rm(kgDe(ex.nome,x.carga),repsE1(ex.nome,x.reps)));
    }
  }
  return best;
}
function limparSessao(n){
  return n.exercicios
    .map(ex=>({nome:canonNome(ex.nome,n.treinoNome),sets:ex.sets.filter(x=>x.carga!==""||x.reps!=="").map(x=>({carga:num(x.carga)||0,reps:num(x.reps)||0,warm:!!x.warm}))}))
    .filter(ex=>ex.nome&&ex.sets.length);
}
function volPorGrupo(s){const acc={};if(!s)return acc;for(const ex of s.exercicios){let v=0;
  for(const x of ex.sets)if(!x.warm)v+=kgDe(ex.nome,x.carga)*repsVol(ex.nome,x.reps);
  if(v>0){const g=grupoDe(ex.nome);acc[g]=(acc[g]||0)+v}}return acc}
function linhasGrupos(sess,ant){
  const gNow=volPorGrupo(sess), gAnt=volPorGrupo(ant);
  const gAll=ORDEM_G.filter(g=>gNow[g]||gAnt[g]);
  const gMax=Math.max(1,...gAll.map(g=>gNow[g]||0));
  return gAll.map(g=>{
    const v=gNow[g]||0, va=gAnt[g]||0, d=v-va;
    const dl=!ant?"<span></span>":!va&&v?`<span class="gdl" style="color:var(--blue)">novo</span>`
      :!v?`<span class="gdl down">▼ ${fmtT(va)}</span>`
      :Math.abs(d)<0.5?`<span class="gdl" style="color:var(--faint)">= igual</span>`
      :`<span class="gdl ${d>0?"up":"down"}">${d>0?"▲":"▼"} ${pctAbs(d,va)}</span>`;
    return `<div class="grow"><span class="gn"><i style="background:${COR_G[g]}"></i>${g}</span>
      <div class="gbar-m"><div style="width:${Math.max(2,Math.round(v/gMax*100))}%;background:${COR_G[g]}"></div></div>
      <span class="gv">${fmtT(v)}</span>${dl}</div>`;
  }).join("");
}
function sessaoAnterior(nome,data){
  return DB.sessions.filter(s=>s.treinoNome===nome&&s.data<data)
    .sort((a,b)=>b.data.localeCompare(a.data))[0];
}
function confirmarSalvar(sess){
  /* recordes precisam ser medidos antes de a sessão entrar no DB */
  const prs=[];

    const ant=recordeE1rm(ex.nome,sess.id);
    let novo=0;
    for(const x of ex.sets)if(!x.warm)novo=Math.max(novo,e1rm(kgDe(ex.nome,x.carga),repsE1(ex.nome,x.reps)));
    if(ant>0&&novo>ant+0.05)prs.push({nome:ex.nome,ganho:novo-ant});
  }
  /* registro de uso: duração (só para treino do próprio dia, até 5 h) */
  const ini=UI.novo&&UI.novo.inicio, min=ini&&sess.data===todayISO()?Math.round((Date.now()-ini)/60000):null;
  USO.treinos.push({data:sess.data,treino:letraTreino(sess.treinoNome),academia:sess.academia||"",
    min:min!=null&&min>0&&min<=300?min:null,exercicios:sess.exercicios.length,
    series:sess.exercicios.reduce((a,ex)=>a+ex.sets.filter(x=>!x.warm).length,0),recordes:prs.length});
  if(USO.treinos.length>USO_MAX_TREINOS)USO.treinos.splice(0,USO.treinos.length-USO_MAX_TREINOS);
  registrarUso("salvar_sessao",{min:USO.treinos[USO.treinos.length-1].min,recordes:prs.length});gravarUso();
  DB.sessions=[sess,...DB.sessions];
  persist();UI.novo=null;
  SCROLL.hist=0;   /* a sessão nova aparece no topo do histórico */
  TAB="hist";render();

  const dias=[...new Set(DB.sessions.map(s=>s.data))].sort();
  const idx=dias.indexOf(sess.data);
  let seq=1;
  for(let i=idx;i>0;i--){const g=(ts(dias[i])-ts(dias[i-1]))/DAY;if(g<=3)seq++;else break}

  /* A revisao ja mostrou tonelagem, series e grupamentos. Aqui fica so o
     que e novidade: recordes e sequencia. Sem nada a comemorar, um aviso
     rapido basta e a sessao ja aparece no topo do historico. */
  if(!prs.length&&seq<2){flash(`Treino salvo · ${DB.sessions.length} sessões no histórico`);return}
  openModal(`<div class="mhero"><span class="ic ${prs.length?"pr":"fl"}">${ic(prs.length?"trophy":"flame",32)}</span>
      <h2>Treino salvo</h2>
      <div class="sub" style="margin-top:0">${esc(sess.treinoNome||"Sessão registrada")} · ${brDate(sess.data)}</div></div>
    ${prs.length?`<div class="pr" style="margin-top:16px"><b style="color:var(--gold-tx);font-size:13.5px">${prs.length} recorde${prs.length>1?"s":""} de carga estimada (e1RM)</b>
      ${prs.map(p=>`<div class="mrow" style="border-color:rgba(242,193,78,.2)"><span style="color:var(--tx)">${esc(p.nome)}</span><b class="d" style="font-size:19px;color:var(--gold-tx)">+${fmt1(p.ganho)} kg</b></div>`).join("")}</div>`:""}
    <div class="tiles">
      ${seq>1?`<div class="tile"><small>sequência</small><span class="v" style="color:var(--acc-tx)">${seq}</span><small>treinos seguidos</small></div>`:""}
      <div class="tile"><small>no histórico</small><span class="v">${DB.sessions.length}</span><small>sessões</small></div>
    </div>`,
    [{label:"Fechar",cls:"btn-p",esc:true}]);
}

/* ============================ aba Histórico ============================ */
/* chave estável da sessão (há sessões antigas importadas sem id) */
const sessKey=s=>s.id||`k:${s.data}:${s.treinoNome||""}:${(s.exercicios||[]).length}`;
function vHist(){
  const todas=[...DB.sessions].sort((a,b)=>b.data.localeCompare(a.data));
  if(!todas.length)return `<h1>Histórico</h1><div class="empty">Nenhuma sessão ainda.<br>Importe seu backup na aba <b>Backup</b>.</div>`;
  const hoje=todayISO(), tH=ts(hoje);
  /* mapa das últimas 12 semanas (seg a dom), colorido pela letra do treino */
  const seg0=tH-((new Date(tH).getDay()+6)%7)*DAY-11*7*DAY;
  const porData={};for(const s of DB.sessions)if(!porData[s.data])porData[s.data]=s;
  let cells="";
  for(let i=0;i<84;i++){
    const iso=isoD(seg0+i*DAY), s=porData[iso];
    if(iso>hoje){cells+=`<i class="f"></i>`;continue}
    cells+=`<i class="${iso===hoje?"t":""}"${s?` style="background:${corTreino(s.exercicios)}"`:""}></i>`;
  }
  const n12=DB.sessions.filter(s=>s.data>=isoD(seg0)&&s.data<=hoje).length;
  const sem12=Math.max(1,(tH-seg0)/DAY/7);
  const pt=(DB.plan&&Array.isArray(DB.plan.treinos))?DB.plan.treinos:[];
  const leg=pt.map(t=>`<span><i style="background:${corTreino(t.exercicios)}"></i>${esc(letraTreino(t.nome))} · ${esc((gruposTreino(t.nome)||t.nome).split(",")[0])}</span>`).join("");
  /* filtro por letra do treino (letras dos últimos 12 meses) */
  const um=isoD(tH-365*DAY);
  const letras=[...new Set(todas.filter(s=>s.data>=um&&s.treinoNome).map(s=>letraTreino(s.treinoNome)))].sort();
  if(UI.histF&&!letras.includes(UI.histF))UI.histF=null;
  const ord=UI.histF?todas.filter(s=>letraTreino(s.treinoNome)===UI.histF):todas;
  let h=`<h1>Histórico</h1><div class="sub">${todas.length} sessões${todas.length?` desde ${brDate(todas[todas.length-1].data)}`:""}</div>
  <div class="card"><div class="ch"><b style="font-size:13.5px;color:var(--tx2)">Últimas 12 semanas</b><span class="tag" style="color:var(--dim)"><b class="d" style="font-size:16px;color:var(--tx)">${fmt1(n12/sem12)}</b> por semana</span></div>
    <div class="heat"><div class="dl"><span>S</span><span></span><span>Q</span><span></span><span>S</span><span></span><span>D</span></div><div class="hm">${cells}</div></div>
    ${leg?`<div class="leg">${leg}</div>`:""}</div>
  ${letras.length>1?`<div class="chips" style="margin-top:12px"><button class="chip ${UI.histF?"":"on"}" onclick="UI.histF=null;render()">Todos</button>${letras.map(l=>`<button class="chip ${UI.histF===l?"on":""}" onclick="UI.histF='${esc(l)}';render()">Treino ${esc(l)}</button>`).join("")}</div>`:""}`;
  /* totais por mês (sobre a lista filtrada inteira) */
  const tot={};for(const s of ord){const k=s.data.slice(0,7);(tot[k]=tot[k]||{n:0,t:0});tot[k].n++;tot[k].t+=tonelagemSessao(s)}
  let mes=null,aberto=false;
  ord.slice(0,UI.qtdHist).forEach(s=>{
    const k=s.data.slice(0,7);
    if(k!==mes){
      if(aberto)h+=`</div>`;
      mes=k;aberto=true;
      h+=`<div class="mh"><span class="secl" style="margin:0">${MESES[Number(k.slice(5,7))-1]} ${k.slice(0,4)}</span><span class="tag" style="color:var(--dim)">${tot[k].n} treino${tot[k].n===1?"":"s"} · <b>${fmtT(tot[k].t)}</b></span></div><div class="card lista">`;
    }
    const key=sessKey(s), open=UI.openSess===key, d=new Date(ts(s.data));
    h+=`<div class="sessw"><div class="sess" data-k="${esc(key)}" onclick="abrirSess(this.dataset.k)">
      <span class="tl s" style="--c:${corTreino(s.exercicios)}">${esc(letraTreino(s.treinoNome))}</span>
      <div class="tx"><b>${esc(tituloTreino(s.treinoNome))}</b><small>${DIAS_S[d.getDay()]}, ${brDate(s.data).slice(0,5)}${s.academia?` · ${esc(s.academia)}`:""}</small></div>
      <div class="vt"><b>${fmtT(tonelagemSessao(s))}</b></div></div>`;
    if(open){
      const efet=(s.exercicios||[]).reduce((a,ex)=>a+(ex.sets||[]).filter(x=>!x.warm).length,0);
      h+=`<div class="sdet"><div class="exl">${(s.exercicios||[]).map(ex=>`<div class="exr"><span>${esc(ex.nome)}</span><b>${esc((ex.sets||[]).map(x=>`${x.warm?"AQ ":""}${fmtSet(ex.nome,x)}`).join(" · "))}</b></div>`).join("")}</div>
        ${s.obs?`<div class="sub" style="font-style:italic;margin-top:8px">"${esc(s.obs)}"</div>`:""}
        <div class="sfoot"><small>${efet} séries efetivas · aquecimento fora da conta</small>
          <button class="btn-danger btn-sm" style="display:inline-flex;align-items:center;gap:6px" onclick="event.stopPropagation();apagarSess(${DB.sessions.indexOf(s)})">${ic("trash",15)}Apagar</button></div></div>`;
    }
    h+=`</div>`;
  });
  if(aberto)h+=`</div>`;
  if(UI.qtdHist<ord.length)h+=`<button class="btn-g btn-w" onclick="UI.qtdHist+=30;render()">Mostrar mais (${ord.length-UI.qtdHist} restantes)</button>`;
  return h;
}
window.abrirSess=k=>{UI.openSess=UI.openSess===k?null:k;render()};
/* apagar pede confirmação. O registro é localizado pela posição no DB

    <div class="mrow" style="margin-top:12px"><span>Conteúdo</span><b class="num">${nEx} exercício${nEx===1?"":"s"} · ${fmtT(tonelagemSessao(s))}</b></div>
    <div class="sub" style="margin-top:10px;color:var(--dim)">Essa ação não pode ser desfeita. Se quiser uma garantia, exporte um backup antes.</div>`,

     {label:"Apagar",cls:"btn-del",fn:()=>{DB.sessions=DB.sessions.filter(x=>x!==s);UI.openSess=null;persist();registrarUso("apagar_sessao",s.data);flash("Sessão apagada");render()}}]);
};

/* ============================ aba Dashboard ============================ */
function quick(id){aplicarPeriodo(id);registrarUso("periodo",id);render()}
/* período do Dashboard sem redesenhar: usado também ao reabrir o app,
   para voltar com o mesmo período que você tinha escolhido            */
function aplicarPeriodo(id){
  const hoje=todayISO();
  const all=[...DB.sessions].map(s=>s.data).sort();
  const first=all[0]||hoje;
  if(id==="tudo"){UI.ini=first;UI.fim=hoje}
  else if(id==="12m"){UI.ini=isoD(ts(hoje)-365*DAY);UI.fim=hoje}
  else if(id==="90d"){UI.ini=isoD(ts(hoje)-90*DAY);UI.fim=hoje}
  else if(id==="2026"){UI.ini="2026-01-01";UI.fim=hoje}
  else if(id==="2025"){UI.ini="2025-01-01";UI.fim="2025-12-31"}
  else return;
  UI.per=id;
}
window.quick=quick;
/* seções recolhíveis: abertas por padrão */
function secHead(id,tit,sub){
  const on=UI.secs[id]!==false;
  return `<div class="sec" onclick="toggleSec('${id}')">
    <div><div class="sec-t">${esc(tit)}</div><div class="sec-s">${esc(sub)}</div></div>
    <span class="sec-c ${on?"open":""}">${ic("chevD",20,2.2)}</span></div>`;
}
window.toggleSec=id=>{UI.secs[id]=UI.secs[id]===false;render()};

function vDash(){
  if(!DB.sessions.length)return `<h1>Evolução</h1><div class="empty">Sem dados ainda.<br>Importe seu backup na aba <b>Backup</b>. O histórico fica salvo no aparelho e esta tela passa a incluir cada treino novo que você registrar.</div>`;
  if(!UI.ini){UI.fim=todayISO();UI.ini=isoD(ts(UI.fim)-365*DAY);UI.per="12m"}
  const S=DB.sessions.filter(s=>s.data>=UI.ini&&s.data<=UI.fim).sort((a,b)=>a.data.localeCompare(b.data));
  const M=DB.measures.filter(m=>m.data>=UI.ini&&m.data<=UI.fim).sort((a,b)=>a.data.localeCompare(b.data));
  const dias=Math.max(1,(ts(UI.fim)-ts(UI.ini))/DAY),semanas=dias/7;
  /* período anterior, mesma duração, imediatamente antes — base dos ▲▼ */
  const pFim=isoD(ts(UI.ini)-DAY),pIni=isoD(ts(UI.ini)-(dias+1)*DAY);
  const P=DB.sessions.filter(s=>s.data>=pIni&&s.data<=pFim);

  const tonAt=S.reduce((a,s)=>a+tonelagemSessao(s),0),tonAnt=P.reduce((a,s)=>a+tonelagemSessao(s),0);
  const freqAt=S.length/semanas,freqAnt=P.length/semanas;
  const dTon=tonAnt>0?((tonAt-tonAnt)/tonAnt)*100:null;
  const byDesc=[...DB.measures].sort((a,b)=>b.data.localeCompare(a.data));
  const lastM=byDesc.find(m=>m.data<=UI.fim&&m.peso!=null),lastG=byDesc.find(m=>m.data<=UI.fim&&m.gordura!=null);
  const cp=M.filter(m=>m.peso!=null),cg=M.filter(m=>m.gordura!=null);
  const dPeso=cp.length>1?cp[cp.length-1].peso-cp[0].peso:null;
  const dGord=cg.length>1?cg[cg.length-1].gordura-cg[0].gordura:null;
  const ambos=M.filter(m=>m.peso!=null&&m.gordura!=null),mgr=x=>x.peso*(1-x.gordura/100);
  const mgAt=ambos.length?mgr(ambos[ambos.length-1]):null;
  const dMg=ambos.length>1?mgr(ambos[ambos.length-1])-mgr(ambos[0]):null;

  const kc=(v,l,d)=>`<div class="kpi"><div class="v num">${v}</div><div class="l">${l}</div>${d||""}</div>`;
  const seta=v=>v>0?"▲ +":v<0?"▼ −":"= ";
  const cls=v=>v>0?"up":v<0?"down":"";
  const dNum=(v,ctx)=>v==null||!isFinite(v)?"":`<div class="d num ${cls(v)}">${seta(v)}${fmt1(Math.abs(v))} <span class="ctx">${ctx}</span></div>`;
  const dPct=(v,ctx)=>v==null||!isFinite(v)?"":`<div class="d num ${cls(v)}">${seta(v)}${Math.round(Math.abs(v))}% <span class="ctx">${ctx}</span></div>`;

  /* variação de medida corporal colorida pela direção desejada: gordura
     caindo e massa magra subindo são verdes; peso fica neutro (depende da fase) */
  const dCorpo=(v,u,bom)=>v==null||!isFinite(v)?`<span class="dl">no período</span>`
    :Math.abs(v)<0.05?`<span class="dl">= igual</span>`
    :`<span class="dl ${bom===0?"":v*bom>0?"up":"down"}">${v>0?"▲":"▼"} ${fmt1(Math.abs(v))}${u}</span>`;
  let h=`<h1>Evolução</h1>
  <div class="sub num">${brDate(UI.ini)} a ${brDate(UI.fim)} · comparado ao período anterior</div>
  <div class="per">
    <div class="seg" role="group" aria-label="Período">${[["90d","90d"],["12m","12m"],["2026","2026"],["2025","2025"],["tudo","Tudo"]]
      .map(([id,lb])=>`<button class="${UI.per===id?"on":""}" onclick="quick('${id}')">${lb}</button>`).join("")}</div>
    <button class="ib bx" style="width:44px;height:44px" aria-label="Escolher datas" onclick="UI.datas=!UI.datas;render()">${ic("cal",18)}</button>
  </div>
  ${UI.datas||!UI.per?`<div class="row" style="margin-top:8px">
      <input type="date" aria-label="Início do período" value="${UI.ini}" onchange="UI.ini=this.value;UI.per=null;render()">
      <input type="date" aria-label="Fim do período" value="${UI.fim}" onchange="UI.fim=this.value;UI.per=null;render()">
    </div>`:""}
  <div class="card">
    <div class="hero"><div><small style="font-size:12.5px;color:var(--dim)">Tonelagem no período</small>
      <div class="v" style="margin-top:2px">${numT(tonAt)}<i>${unT(tonAt)}</i></div></div>${dTon!=null?dpill(dTon/100*tonAnt,null,tonAnt):""}</div>
    <div class="tiles" style="margin-top:12px">
      <div class="tile"><small>Sessões</small><span class="v" style="font-size:24px">${S.length}</span>${P.length?dpill(S.length-P.length,v=>Math.round(v),null):""}</div>
      <div class="tile"><small>Por semana</small><span class="v" style="font-size:24px">${fmt1(freqAt)}</span>${P.length?dpill(freqAt-freqAnt,fmt1,null):""}</div>
    </div>
  </div>
  ${lastM||lastG?`<div class="card trio">
    <div><small>Peso</small><span class="v">${lastM?fmt1(lastM.peso):"·"}<i>kg</i></span>${dCorpo(dPeso," kg",0)}</div>
    <div><small>Gordura</small><span class="v">${lastG?fmt1(lastG.gordura):"·"}<i>%</i></span>${dCorpo(dGord," p.p.",-1)}</div>
    <div><small>Massa magra</small><span class="v">${mgAt?fmt1(mgAt):"·"}<i>kg</i></span>${dCorpo(dMg," kg",1)}</div>
  </div>`:""}`;

  /* ───────────────────── GRUPAMENTO (seção principal) ─────────────────────
     Filtro em dois niveis: primeiro o grupamento muscular, depois (opcional)
     um exercicio (familia) dentro dele. O grafico mostra o volume treino a
     treino do que estiver selecionado, com a media movel de 30 dias por cima. */
  const JAN=30;                                   /* janela da média móvel, em dias */
  /* volume por grupo em todo o período e no anterior (para os chips e o comparativo) */
  const somaG=acc=>arr=>{for(const s of arr)for(const ex of (s.exercicios||[])){
    const t=(ex.sets||[]).reduce((b,x)=>x.warm?b:b+kgDe(ex.nome,x.carga)*repsVol(ex.nome,x.reps),0);
    if(t>0){const g=grupoDe(ex.nome);acc[g]=(acc[g]||0)+t}}};
  const vg={},vgP={};somaG(vg)(S);somaG(vgP)(P);
  const gruposComDados=ORDEM_G.filter(g=>vg[g]);
  if(gruposComDados.length){
    if(!UI.gSel||!vg[UI.gSel])UI.gSel=Object.entries(vg).sort((a,b)=>b[1]-a[1])[0][0];
    const g=UI.gSel;
    /* famílias de exercício dentro do grupo, no período */
    const famCnt={},famRep={};
    for(const s of S)for(const ex of (s.exercicios||[])){
      if(grupoDe(ex.nome)!==g)continue;
      if(!(ex.sets||[]).some(x=>!x.warm&&num(x.carga)>0))continue;
      const k=familiaDe(ex.nome);famCnt[k]=(famCnt[k]||0)+1;
      const rc=famRep[k]=famRep[k]||{};rc[ex.nome]=(rc[ex.nome]||0)+1;
    }
    const repDe=k=>Object.entries(famRep[k]||{}).sort((a,b)=>b[1]-a[1])[0]?.[0]||k;
    const rotDe=k=>{const fi=familiaInfo(repDe(k));return fi.regra?fi.label:repDe(k)};
    if(UI.exSel&&!famCnt[UI.exSel])UI.exSel=null;
    const fams=Object.keys(famCnt).sort((a,b)=>famCnt[b]-famCnt[a]||rotDe(a).localeCompare(rotDe(b),"pt-BR"));
    const filtroEx=UI.exSel?` · ${rotDe(UI.exSel)}`:"";
    /* série treino a treino: só sessões em que o grupo/exercício apareceu */
    const volSess=s=>(s.exercicios||[]).reduce((a,ex)=>{
      if(grupoDe(ex.nome)!==g)return a;
      if(UI.exSel&&familiaDe(ex.nome)!==UI.exSel)return a;
      return a+(ex.sets||[]).reduce((b,x)=>x.warm?b:b+kgDe(ex.nome,x.carga)*repsVol(ex.nome,x.reps),0)},0);
    const pts=S.map(s=>({t:ts(s.data),data:s.data,nome:s.treinoNome,v:volSess(s),cor:corTreino(s.exercicios),let:letraTreino(s.treinoNome)})).filter(p=>p.v>0);
    /* média móvel: média das sessões dos últimos 30 dias, inclusive a atual */
    const mm=pts.map((p,i)=>{const w=pts.filter(q=>q.t>p.t-JAN*DAY&&q.t<=p.t);return w.reduce((a,q)=>a+q.v,0)/w.length});
    /* comparativos: último treino vs anterior; média 30d vs 30d anteriores */
    const ult=pts[pts.length-1],ant=pts[pts.length-2];
    const dUlt=ult&&ant?(ult.v-ant.v)/ant.v*100:null;
    const tFim=ult?ult.t:ts(UI.fim);
    const j1=pts.filter(p=>p.t>tFim-JAN*DAY),j2=pts.filter(p=>p.t<=tFim-JAN*DAY&&p.t>tFim-2*JAN*DAY);
    const m1=j1.length?j1.reduce((a,p)=>a+p.v,0)/j1.length:null,m2=j2.length?j2.reduce((a,p)=>a+p.v,0)/j2.length:null;
    const dMm=m1!=null&&m2?(m1-m2)/m2*100:null;
    const pctTxt=v=>v==null||!isFinite(v)?"—":`<span class="${cls(v)}">${seta(v)}${Math.abs(v)<10?fmt1(Math.abs(v)):Math.round(Math.abs(v))}%</span>`;

    h+=secHead("grupo","Grupamento","Volume treino a treino e média móvel de 30 dias");
    if(UI.secs.grupo!==false){
      h+=`<div class="chips scroll">${gruposComDados.map(x=>
        `<button class="chip gchip ${x===g?"on":""}" style="--c:${COR_G[x]}" onclick="UI.gSel='${x}';UI.exSel=null;render()"><i></i>${esc(x)} <small>${fmtT(vg[x])}</small></button>`).join("")}</div>`;
      /* painel do grupo */
      const emT=pts.some(p=>p.v>=1000);
      const yF=emT?(v=>fmt1(v/1000)+" t"):(v=>Math.round(v)+" kg");
      const xsL=pts.map(p=>brDate(p.data).slice(0,5));
      h+=`<div class="card">
        <div class="ch"><b class="ct" style="color:${COR_G[g]};font-size:24px!important">${esc(g)}</b><span class="tag">${pts.length} treino${pts.length===1?"":"s"}${filtroEx?esc(filtroEx):""}</span></div>
        <div class="mini">
          <div><div class="mv num">${ult?fmtT(ult.v):"—"}</div><div class="ml">último treino${ult?` · ${brDate(ult.data)}`:""}</div><div class="md num">${pctTxt(dUlt)} <span class="ctx">vs anterior</span></div></div>
          <div><div class="mv num">${m1!=null?fmtT(m1):"—"}</div><div class="ml">média móvel ${JAN}d</div><div class="md num">${pctTxt(dMm)} <span class="ctx">vs ${JAN}d antes</span></div></div>
          <div><div class="mv num">${fmtT(pts.reduce((a,p)=>a+p.v,0))}</div><div class="ml">total no período</div><div class="md num">${pctTxt(vgP[g]&&!UI.exSel?(vg[g]-vgP[g])/vgP[g]*100:null)} <span class="ctx">vs per. ant.</span></div></div>
        </div>
        ${pts.length?chart({xs:xsL,xLabels:xsL,yFmt:yF,bars:{vals:pts.map(p=>p.v),color:COR_G[g]},series:[{pts:mm.map((v,i)=>[i,v]),color:"var(--tx)"}]}):`<div class="sub">Sem treinos desse grupo no período.</div>`}
        ${legend([[COR_G[g],"volume por treino"],["var(--tx)",`média móvel ${JAN} dias`]])}
      </div>`;
      /* chips de exercício (segundo nível) */
      if(fams.length){
        h+=`<div class="chips scroll" style="margin-top:10px">
          <button class="chip ${UI.exSel?"":"on"}" onclick="UI.exSel=null;render()">Todos</button>
          ${fams.map(k=>`<button class="chip ${k===UI.exSel?"on":""}" onclick="UI.exSel='${esc(k).replace(/'/g,"&#39;")}';render()">${esc(rotDe(k))} <small>${famCnt[k]}×</small></button>`).join("")}
        </div>`;
      }
      /* força do exercício escolhido */
      if(UI.exSel){
        const prog=[];
        for(const s of S){let best=null,bestE=null;
          for(const ex of (s.exercicios||[]))if(familiaDe(ex.nome)===UI.exSel)
            for(const x of (ex.sets||[]))if(!x.warm&&num(x.carga)>0){
              const c=kgDe(ex.nome,x.carga);
              if(best==null||c>best)best=c;
              const e=e1rm(c,repsE1(ex.nome,x.reps));if(bestE==null||e>bestE)bestE=e}
          if(best!=null)prog.push({t:ts(s.data),c:best,e:bestE})}
        const dE=prog.length>1?prog[prog.length-1].e-prog[0].e:null;
        const nomesFam=Object.keys(famRep[UI.exSel]||{});
        h+=`<div class="card">
          <div class="ch" style="align-items:center"><b class="ct">Força · ${esc(rotDe(UI.exSel))}</b>${dE!=null?dpill(dE,v=>fmt1(v)+" kg",null):""}</div>
          ${nomesFam.length>1?`<div class="sub">agrupa: ${esc(nomesFam.join(" · "))}</div>`:""}
          ${chart({xTime:true,xs:prog.map(p=>p.t),yFmt:v=>fmt1(v),series:[
            {pts:prog.map(p=>[p.t,p.c]),color:"var(--blue)",dots:prog.length<40},
            {pts:prog.map(p=>[p.t,p.e]),color:"var(--tx)",dash:true}]})}
          ${legend([["var(--blue)","carga máx (kg)"],["var(--tx)","e1RM estimado (kg)"]])}</div>`;
      }
      /* últimos treinos do grupo, com delta vs o anterior */
      if(pts.length){
        const ultimos=[...pts].reverse().slice(0,8);
        h+=`<div class="card"><div class="ch"><b class="ct">Últimos treinos</b><span class="tag">${esc(UI.exSel?rotDe(UI.exSel):g)}</span></div>
          <table><tr><th>Data</th><th>Treino</th><th style="text-align:right">Volume</th><th style="text-align:right">Δ</th></tr>
          ${ultimos.map((p,i)=>{const idx=pts.indexOf(p),a=pts[idx-1];const d=a?(p.v-a.v)/a.v*100:null;
            return `<tr><td class="d" style="font-size:15px">${brDate(p.data).slice(0,5)}</td><td><span class="tl xs" style="--c:${p.cor}">${esc(p.let)}</span></td><td class="d" style="text-align:right;font-size:15px;font-weight:600">${fmtT(p.v)}</td><td class="d" style="text-align:right;font-size:14px;font-weight:600">${pctTxt(d)}</td></tr>`}).join("")}
          </table></div>`;
      }
      /* comparativo entre grupos: atual vs período anterior (toque seleciona) */
      const gs=Object.entries(vg).sort((a,b)=>b[1]-a[1]),maxG=gs[0][1];
      h+=`<div class="card"><div class="ch" style="margin-bottom:6px"><b class="ct">Todos os grupos</b><span class="tag">${fmtT(tonAt)} no período</span></div>
      ${gs.map(([x,v])=>{const p=vgP[x]||0,d=p>0?((v-p)/p)*100:null;
        return `<div class="gbar${x===g?" sel":""}" style="cursor:pointer" onclick="UI.gSel='${x}';UI.exSel=null;render()">
          <span class="gn" style="${x===g?`color:${COR_G[x]};font-weight:700`:""}">${esc(x)}</span>
          <span class="gt"><i style="width:${Math.max(2,v/maxG*100).toFixed(1)}%;background:${COR_G[x]||"var(--faint)"}"></i></span>
          <span class="num gv">${fmtT(v)}</span>
          <span class="num gd ${d==null?"":cls(d)}">${d==null?"—":(d>0?"+":d<0?"−":"")+Math.round(Math.abs(d))+"%"}</span>
        </div>`}).join("")}
      <div class="sub" style="margin-top:10px;font-size:12px">% contra o período anterior (${brDate(pIni)} a ${brDate(pFim)}) · toque num grupo para abrir</div></div>`;
    }
  }

  /* ─────────────────────── CONSISTÊNCIA ─────────────────────── */
  h+=secHead("consist","Consistência","Tonelagem semanal e frequência mensal");
  if(UI.secs.consist!==false){
    const wk=new Map();
    /* semanas sem treino entram como zero: senão a média móvel de 4 semanas
       ignora as paradas e o eixo encolhe o tempo parado                     */
    const seg=t=>t-((new Date(t).getDay()+6)%7)*DAY;
    for(let t=seg(ts(UI.ini));t<=ts(UI.fim);t+=7*DAY)wk.set(t,0);
    for(const s of S){const w=seg(ts(s.data));wk.set(w,(wk.get(w)||0)+tonelagemSessao(s))}
    const wkE=[...wk.entries()].sort((a,b)=>a[0]-b[0]);
    if(wkE.length>1){
      const xsW=wkE.map(([t])=>{const d=new Date(t);return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`});
      const vals=wkE.map(e=>e[1]);
      const mm=vals.map((_,i)=>{const w=vals.slice(Math.max(0,i-3),i+1);return w.reduce((a,b)=>a+b,0)/w.length});
      const emT=Math.max(...vals)>=1000;               /* unidade única no eixo */
      const yF=emT?(v=>fmt1(v/1000)+" t"):(v=>Math.round(v)+" kg");
      h+=`<div class="card"><div class="ch"><b class="ct">Tonelagem semanal</b><span class="tag">média ${fmtT(vals.reduce((a,b)=>a+b,0)/vals.length)}/sem</span></div>
        ${chart({xs:xsW,xLabels:xsW,yFmt:yF,bars:{vals,color:"var(--blue)"},series:[{pts:mm.map((v,i)=>[i,v]),color:"var(--tx)"}]})}
        ${legend([["var(--blue)","semana"],["var(--tx)","média móvel 4 sem."]])}</div>`;
    }
    const fm=new Map();let t=ts(UI.ini);
    while(t<=ts(UI.fim)){const d=new Date(t);const k=`${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getFullYear()).slice(2)}`;
      if(!fm.has(k))fm.set(k,0);d.setMonth(d.getMonth()+1);d.setDate(1);t=d.getTime()}
    for(const s of S){const k=`${s.data.slice(5,7)}/${s.data.slice(2,4)}`;if(fm.has(k))fm.set(k,fm.get(k)+1)}
    const fmK=[...fm.keys()],fmV=[...fm.values()];
    const media=fmV.length?fmV.reduce((a,b)=>a+b,0)/fmV.length:0;
    h+=`<div class="card"><div class="ch"><b class="ct">Frequência mensal</b><span class="tag">média ${fmt1(media)}/mês</span></div>
      ${chart({xs:fmK,xLabels:fmK,bars:{vals:fmV,color:"var(--purple)"},series:[{pts:fmK.map((_,i)=>[i,media]),color:"var(--faint)",dash:true}]})}</div>`;
  }

  /* ─────────────────────────── CORPO ─────────────────────────── */
  const comFitas=[...DB.measures].filter(m=>m.fitas&&Object.keys(m.fitas).length).sort((a,b)=>b.data.localeCompare(a.data));
  if(cp.length>1||comFitas.length){
    h+=secHead("corpo","Corpo","Composição corporal e perimetria");
    if(UI.secs.corpo!==false){
      if(cp.length>1){
        h+=`<div class="card"><b class="ct">Composição corporal</b>
          <div class="gt" style="margin-top:12px">Peso (kg)</div>
          ${chart({h:150,xTime:true,xs:cp.map(m=>ts(m.data)),yFmt:v=>fmt1(v),series:[{pts:cp.map(m=>[ts(m.data),m.peso]),color:"var(--blue)",dots:cp.length<40}]})}
          <div class="gt">Gordura (%)</div>
          ${chart({h:150,xTime:true,xs:cg.map(m=>ts(m.data)),yFmt:v=>fmt1(v),series:[{pts:cg.map(m=>[ts(m.data),m.gordura]),color:"var(--purple)",dots:cg.length<40}]})}</div>`;
      }
      if(comFitas.length){
        const atual=comFitas[0],ant=comFitas[1];
        h+=tabelaFitas(atual,ant);
      }
    }
  }
  return h;
}

/* ============================ aba Medidas ============================ */
/* perimetria: as chaves seguem as do seu último check-in com fitas, para
   os registros novos baterem com os antigos; sem nenhum, uma lista padrão */
const FITAS_PADRAO=["Braço","Ombros","Peito","Cintura","Abdome","Coxa","Panturrilha"];
const fitaBoaCai=k=>/cintura|abd[oô]m|quadril/i.test(k);
const temFitas=m=>!!(m&&m.fitas&&Object.keys(m.fitas).length);
function chavesFitas(){
  const m=[...DB.measures].filter(temFitas).sort((a,b)=>b.data.localeCompare(a.data))[0];
  return m?Object.keys(m.fitas):FITAS_PADRAO;
}
/* tabela de perimetria: verde é a direção desejada (cintura e abdome caindo) */
function tabelaFitas(a,b){
  return `<div class="card"><div class="ch"><b class="ct">Perimetria</b><span class="tag">${brDate(a.data)}${b?` vs ${brDate(b.data)}`:""}</span></div>
    <table><tr><th>Medida</th><th style="text-align:right">Atual</th><th style="text-align:right">Δ</th></tr>
    ${Object.keys(a.fitas).map(k=>{
      const v=num(a.fitas[k]), pv=b&&b.fitas?num(b.fitas[k]):NaN, d=isFinite(pv)?v-pv:null, bom=fitaBoaCai(k)?-1:1;
      const dl=d==null?`<span style="color:var(--faint)">·</span>`:Math.abs(d)<0.05?`<span style="color:var(--faint)">=</span>`
        :`<span class="${d*bom>0?"up":"down"}">${d>0?"▲":"▼"} ${fmt1(Math.abs(d))}</span>`;
      return `<tr><td>${esc(k)}</td><td class="d" style="text-align:right;font-size:16px;font-weight:600">${fmt1(v)} cm</td><td class="d" style="text-align:right;font-size:15px;font-weight:600">${dl}</td></tr>`}).join("")}
    </table><div class="sub" style="margin-top:8px;font-size:12px">verde é a direção desejada: medidas subindo, cintura e abdome descendo</div></div>`;
}
const mmTxt=nm=>{const p=num(nm.peso),g=num(nm.gordura);return isFinite(p)&&isFinite(g)&&p>0?fmt1(p*(1-g/100))+" kg":"·"};
window.atualizarMM=()=>{const el=document.getElementById("mmcalc");if(el)el.textContent=mmTxt(UI.novaMed)};
function formMedida(nm,ord){
  const ks=chavesFitas(), ult=ord.find(temFitas);
  return `<div class="card">
    <div class="ch" style="align-items:center"><b class="ct">Novo registro</b>${ord.length?`<button class="btn-g btn-sm" onclick="UI.medForm=false;render()">Fechar</button>`:""}</div>
    <span class="lbl">Data</span><input type="date" value="${nm.data}" onchange="UI.novaMed.data=this.value">
    <div class="row big2">
      <label style="display:block"><span class="lbl">Peso (kg)</span><input inputmode="decimal" value="${esc(nm.peso)}" oninput="UI.novaMed.peso=this.value;atualizarMM()"></label>
      <label style="display:block"><span class="lbl">Gordura (%)</span><input inputmode="decimal" value="${esc(nm.gordura)}" oninput="UI.novaMed.gordura=this.value;atualizarMM()"></label>
    </div>
    <div class="mmc"><span>Massa magra calculada</span><b id="mmcalc">${mmTxt(nm)}</b></div>
    <span class="lbl" style="margin-top:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:var(--tx2)">Perimetria · opcional, em cm</span>
    <div class="fitas">${ks.map(k=>`<label>${esc(k)}<input inputmode="decimal" data-fita="${esc(k)}" placeholder="${ult&&ult.fitas[k]!=null?esc(cIn(ult.fitas[k])):""}" value="${esc(nm.fitas[k]||"")}" oninput="UI.novaMed.fitas[this.dataset.fita]=this.value"></label>`).join("")}</div>
    ${ult?`<div class="sub" style="font-size:12px;margin-top:8px">Em cinza, os valores do check-in de ${brDate(ult.data)}.</div>`:""}
    <button class="btn-p btn-w" style="min-height:52px" onclick="salvarMedida()">Salvar medida</button>
  </div>`;
}
function vMed(){
  const ord=[...DB.measures].sort((a,b)=>b.data.localeCompare(a.data));
  const nm=UI.novaMed;if(!nm.fitas)nm.fitas={};
  const aberto=UI.medForm||!ord.length;
  let h=`<div class="ch" style="align-items:flex-end"><div><h1>Medidas</h1><div class="sub">${ord.length} registro${ord.length===1?"":"s"}${ord[0]?` · último em ${brDate(ord[0].data)}`:""}</div></div>
    ${aberto?"":`<button class="btn-p btn-sm" style="min-height:42px;display:inline-flex;align-items:center;gap:6px" onclick="UI.medForm=true;render();$('#app').scrollTop=0">${ic("plus",16,2.6)}Novo</button>`}</div>`;
  if(aberto)h+=formMedida(nm,ord);
  /* resumo: último registro contra o anterior; peso neutro, gordura caindo e
     massa magra subindo em verde */
  const comP=ord.filter(m=>m.peso!=null), comG=ord.filter(m=>m.gordura!=null), comMG=ord.filter(m=>m.peso!=null&&m.gordura!=null);
  const mgr=x=>x.peso*(1-x.gordura/100);
  const dl=(d,u,bom)=>Math.abs(d)<0.05?`<span class="dl">= igual</span>`:`<span class="dl ${bom===0?"":d*bom>0?"up":"down"}">${d>0?"▲":"▼"} ${fmt1(Math.abs(d))}${u}</span>`;
  if(comP.length||comG.length){
    const p0=comP[0],p1=comP[1],g0=comG[0],g1=comG[1],m0=comMG[0],m1=comMG[1], ref=p1||g1;
    const serie=(arr,campo,cor)=>{const a=[...arr].reverse();return chart({h:120,xTime:true,xs:a.map(m=>ts(m.data)),yFmt:v=>fmt1(v),series:[{pts:a.map(m=>[ts(m.data),m[campo]]),color:cor,dots:a.length<40}]})};
    h+=`<div class="card"><span class="sub" style="margin-top:0;display:block">${ref?`Comparado com o registro de ${brDate(ref.data)}`:"Primeiro registro"}</span>
      <div class="trio" style="margin-top:10px">
        <div><small>Peso</small><span class="v">${p0?fmt1(p0.peso):"·"}<i>kg</i></span>${p0&&p1?dl(p0.peso-p1.peso," kg",0):""}</div>
        <div><small>Gordura</small><span class="v">${g0?fmt1(g0.gordura):"·"}<i>%</i></span>${g0&&g1?dl(g0.gordura-g1.gordura," p.p.",-1):""}</div>
        <div><small>Massa magra</small><span class="v">${m0?fmt1(mgr(m0)):"·"}<i>kg</i></span>${m0&&m1?dl(mgr(m0)-mgr(m1)," kg",1):""}</div>
      </div>
      ${comP.length>1?`<div class="gt">Peso (kg)</div>${serie(comP,"peso","var(--blue)")}`:""}
      ${comG.length>1?`<div class="gt">Gordura (%)</div>${serie(comG,"gordura","var(--purple)")}`:""}
    </div>`;
  }
  const cf=ord.filter(temFitas);
  if(cf.length)h+=tabelaFitas(cf[0],cf[1]);
  if(ord.length){
    h+=`<span class="secl">Registros</span><div class="card" style="padding:4px 4px 4px 14px">${ord.slice(0,UI.qtdMed||15).map(m=>`<div class="mrec">
      <span class="dt">${brDate(m.data)}</span>
      <span class="vl">${m.peso!=null?fmt1(m.peso)+" kg":"·"}${m.gordura!=null?` · ${fmt1(m.gordura)}%`:""}</span>
      ${temFitas(m)?`<span class="mini-tag">fitas</span>`:""}
      <button class="ib" aria-label="Apagar registro de ${brDate(m.data)}" onclick="apagarMed(${DB.measures.indexOf(m)})">${ic("trash",17)}</button></div>`).join("")}</div>`;
    if((UI.qtdMed||15)<ord.length)h+=`<button class="btn-g btn-w" onclick="UI.qtdMed=(UI.qtdMed||15)+30;render()">Mostrar mais (${ord.length-(UI.qtdMed||15)} restantes)</button>`;
  }
  return h;
}
window.salvarMedida=()=>{
  const nm=UI.novaMed;
  const fitas={};for(const [k,v] of Object.entries(nm.fitas||{})){const x=num(v);if(isFinite(x)&&x>0)fitas[k]=x}
  if(!nm.peso&&!nm.gordura&&!Object.keys(fitas).length){flash("Preencha ao menos o peso");return}
  DB.measures=[{id:`m-${nm.data}-${uid().slice(0,4)}`,data:nm.data,peso:num(nm.peso)||null,gordura:num(nm.gordura)||null,fitas},...DB.measures];
  persist();registrarUso("salvar_medida",Object.keys(fitas).length?"com_fitas":"sem_fitas");
  UI.novaMed={data:todayISO(),peso:"",gordura:"",fitas:{}};UI.medForm=false;flash("Medida salva ✓");render();
};
window.apagarMed=i=>{
  const m=DB.measures[i];if(!m)return;
  openModal(`<h2>Apagar registro?</h2>
    <div class="sub">${brDate(m.data)} · ${m.peso!=null?fmt1(m.peso)+" kg":"sem peso"}${m.gordura!=null?` · ${fmt1(m.gordura)}%`:""}${m.fitas&&Object.keys(m.fitas).length?" · com perimetria":""}</div>
    <div class="sub" style="margin-top:10px;color:var(--dim)">Essa ação não pode ser desfeita.</div>`,
    [{label:"Cancelar",cls:"btn-g",esc:true},
     {label:"Apagar",cls:"btn-del",fn:()=>{DB.measures=DB.measures.filter(x=>x!==m);persist();registrarUso("apagar_medida",m.data);flash("Registro apagado");render()}}]);
};

/* resumo do registro de uso (card da aba Backup) */

      <div class="mrow"><span>Toques registrados</span><b class="num">${toques}</b></div>
      ${top.length?`<div class="mrow"><span>Mais tocados</span><b style="font-weight:600;text-align:right">${top.map(([k,v])=>`${esc(k.replace(/^(\w+):/,(m,id)=>nomeAba(id)+":"))} (${v})`).join("<br>")}</b></div>`:""}

  if(p.secs&&typeof p.secs==="object")UI.secs=p.secs;
  if(p.gSel)UI.gSel=p.gSel;
  if(p.exSel)UI.exSel=p.exSel;

  if(p.per)aplicarPeriodo(p.per);
  else if(p.ini&&p.fim){UI.ini=p.ini;UI.fim=p.fim;UI.per=null}
  const q=j.pos;
  if(!q||!(Date.now()-q.t<UI_JANELA))return false;
  if(TABS.some(t=>t[0]===q.tab))TAB=q.tab;

}

/* ================= viewport e teclado =================
   Nesta arquitetura o JS nao "corrige rolagem". Ele so mantem o #shell
   com a altura exata da area visivel. Quando o teclado sobe, a area de
   rolagem encolhe e todo o conteudo continua alcancavel acima dele.

   Duas coisas o visualViewport nao resolve sozinho e por isso sao
   tratadas aqui:
   a) a barra de acessorios do iOS ("Preencher Automaticamente" / sugestoes
      de teclados como o SwiftKey) fica POR CIMA da area visivel e nem
      sempre entra na conta. Reservamos um espaco fixo para ela;
   b) teclados de terceiros abrem em duas etapas de altura. Como aqui cada
      etapa apenas reajusta a altura do shell, nao existe mais o problema
      de acertar o instante certo: qualquer etapa fica correta.        */
const ACESSORIOS=52;     /* faixa reservada acima do teclado */
const FOLGA_TOPO_MIN=12;
let campoFoco=null, manual=false, tRevela=null;

const elShell=()=>document.getElementById("shell");
const elApp=()=>document.getElementById("app");

function alturaTeclado(){
  const vv=window.visualViewport;
  return vv?Math.max(0,Math.round(window.innerHeight-vv.height)):0;
}
/* unica funcao que mexe no layout: iguala o shell a area visivel */
function sincronizarViewport(){
  const vv=window.visualViewport, sh=elShell(), app=elApp();
  if(!sh)return;
  /* minimizado, o iOS informa uma area visivel zerada ou minuscula. Se o
     shell fosse encolhido para isso, ao voltar o app ficava com a tela
     preta ate ser reiniciado. Em segundo plano o layout nao e tocado. */
  if(document.visibilityState==="hidden")return;
  const h=Math.round(vv?vv.height:window.innerHeight);
  if(h<150){sh.style.height="";sh.style.top="0px";return}
  const kb=alturaTeclado(), comTeclado=kb>80;
  sh.style.height=h+"px";
  /* a pagina nunca deve rolar; se o Safari deslocar, volta ao lugar */
  if(vv&&vv.offsetTop>0)sh.style.top=Math.round(vv.offsetTop)+"px";
  else sh.style.top="0px";
  document.documentElement.style.setProperty("--vvh",h+"px");
  document.documentElement.style.setProperty("--acess",comTeclado?ACESSORIOS+"px":"0px");
  document.body.classList.toggle("kb",comTeclado);
  if(window.scrollY!==0){try{window.scrollTo(0,0)}catch(e){}}
}
window.sincronizarViewport=sincronizarViewport;

/* iOS standalone: depois que o teclado fecha, o WebKit as vezes deixa o
   viewport "preso" menor (innerHeight e visualViewport.height nao voltam),
   o que deixa uma faixa preta embaixo da barra de abas. Guardamos a maior
   altura ja vista sem teclado e, se a atual ficar abaixo dela, forcamos o
   WebKit a remedir escondendo e mostrando o #shell num unico reflow.   */
let alturaMax=0, larguraRef=0;
function campoAtivo(){
  const a=document.activeElement;
  return !!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"));
}
function registrarAlturaMax(){
  if(document.visibilityState==="hidden"||campoAtivo())return;
  const w=window.innerWidth, h=window.innerHeight;
  if(w!==larguraRef){larguraRef=w;alturaMax=h;return}   /* girou: recomeca */
  if(h>alturaMax)alturaMax=h;
}
function destravarViewport(){
  if(document.visibilityState==="hidden"||campoAtivo())return false;
  if(window.innerWidth!==larguraRef||!alturaMax)return false;
  if(window.innerHeight>=alturaMax-4)return false;
  const sh=elShell(), app=elApp();
  if(!sh)return false;
  const top=app?app.scrollTop:0;
  sh.style.display="none";
  void sh.offsetHeight;          /* reflow sincrono, sem pintar no meio */
  sh.style.display="";
  if(app)app.scrollTop=top;
  sincronizarViewport();
  return true;
}
function conferirViewport(){
  if(!destravarViewport())registrarAlturaMax();
  else setTimeout(()=>{sincronizarViewport();registrarAlturaMax()},120);
}
window.destravarViewport=destravarViewport;

/* a barra de progresso agora fica fora da area rolavel: o topo do #app ja
   comeca abaixo dela, entao basta uma folga visual minima */
function folgaTopo(){ return FOLGA_TOPO_MIN; }
function sugDoCampo(el){
  const nx=el&&el.nextElementSibling;
  return (nx&&nx.classList&&nx.classList.contains("sug")&&nx.offsetHeight>0&&nx.style.display!=="none")?nx:null;
}
/* Rola o container o MINIMO necessario, e so quando algo esta mesmo
   encoberto. Nunca recentraliza por conta propria: e isso que antes
   desfazia o arrasto do usuario.                                     */
function revelarFoco(forcar){
  const el=campoFoco, app=elApp();
  if(!el||!app||!el.isConnected||document.activeElement!==el)return;
  if(manual&&!forcar)return;
  const rc=app.getBoundingClientRect(), r=el.getBoundingClientRect();
  const limTopo=rc.top+folgaTopo(), limBase=rc.bottom-ACESSORIOS;
  if(limBase-limTopo<60)return;
  let dy=0;
  const sg=sugDoCampo(el);
  const fim=sg?Math.max(r.bottom,sg.getBoundingClientRect().bottom):r.bottom;
  if(r.top<limTopo)            dy=r.top-limTopo;            /* atras do cabecalho */
  else if(r.bottom>limBase)    dy=r.bottom-limBase;         /* atras do teclado   */
  else if(sg&&fim>limBase){                                  /* lista cortada     */
    dy=Math.min(fim-limBase, r.top-limTopo);                 /* sem esconder o campo */
    if(dy<=0)return;
  }else return;
  if(Math.abs(dy)<8)return;
  app.scrollTop=Math.max(0,Math.round(app.scrollTop+dy));
}
window.revelarFoco=revelarFoco;

/* ---- eventos ---- */
if(window.visualViewport){

    sincronizarViewport();
    /* cada etapa de abertura do teclado reconfere, sem depender de timing */
    clearTimeout(tRevela);tRevela=setTimeout(()=>revelarFoco(true),60);
  });
  window.visualViewport.addEventListener("scroll",sincronizarViewport);
}
window.addEventListener("resize",()=>{sincronizarViewport();registrarAlturaMax()});
window.addEventListener("orientationchange",()=>setTimeout(sincronizarViewport,250));

document.addEventListener("focusin",e=>{
  const el=e.target;
  if(!el||(el.tagName!=="INPUT"&&el.tagName!=="TEXTAREA"&&el.tagName!=="SELECT"))return;
  campoFoco=el;manual=false;
  sincronizarViewport();
  clearTimeout(tRevela);
  /* revela agora e de novo quando o teclado terminar de subir */
  revelarFoco(true);
  tRevela=setTimeout(()=>revelarFoco(true),320);
});
document.addEventListener("focusout",()=>{
  setTimeout(()=>{
    const a=document.activeElement;
    if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"))return;
    campoFoco=null;manual=false;clearTimeout(tRevela);
    sincronizarViewport();
    /* da tempo do teclado terminar de descer e confere se o iOS travou */
    setTimeout(conferirViewport,160);
    setTimeout(conferirViewport,600);
  },120);
});

/* toque na lista de sugestoes: arrastar rola, tocar seleciona */
let tqSug=null;
document.addEventListener("touchstart",e=>{

  const p=e.touches&&e.touches[0];
  tqSug=(it&&p)?{el:it,x:p.clientX,y:p.clientY,mov:false}:null;
},{passive:true});
document.addEventListener("touchmove",e=>{
  const p=e.touches&&e.touches[0];
  if(tqSug&&p&&(Math.abs(p.clientX-tqSug.x)>8||Math.abs(p.clientY-tqSug.y)>8))tqSug.mov=true;
},{passive:true});
document.addEventListener("touchend",e=>{
  const q=tqSug;tqSug=null;
  if(!q||q.mov||!q.el.isConnected)return;
  e.preventDefault();          /* evita o clique sintetico duplicado do iOS */
  q.el.click();
},{passive:false});
document.addEventListener("touchcancel",()=>{tqSug=null},{passive:true});

/* ao minimizar: grava tudo. Ao voltar: refaz o layout e redesenha. */
function aoSair(){

  gravarUso();
}
function aoVoltar(){
  if(!abaContada){abaContada=abaAtual();abaDesde=Date.now();USO.retornos=(USO.retornos||0)+1;agendarUso()}
  campoFoco=null;manual=false;
  document.body.classList.remove("kb");
  sincronizarViewport();
  try{render()}catch(e){}
  setTimeout(sincronizarViewport,150);
  setTimeout(()=>{sincronizarViewport();conferirViewport()},600);
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden")aoSair();else aoVoltar();
});
window.addEventListener("pagehide",aoSair);
window.addEventListener("pageshow",e=>{if(e.persisted)aoVoltar()});
window.addEventListener("focus",()=>setTimeout(sincronizarViewport,50));

sincronizarViewport();
registrarAlturaMax();
/* rede de seguranca: ao trocar de aba ou tocar fora de um campo, confere */
document.addEventListener("click",e=>{if(!campoAtivo()&&e.target&&e.target.closest&&e.target.closest("#nav"))setTimeout(conferirViewport,50)},true);
</script>
</body>
</html>
